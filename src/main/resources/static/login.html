<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kanin — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<div class="auth-shell">

    <div class="auth-left">
        <div class="auth-left-inner">
            <div class="logo">
                <span class="logo-mark">⬡</span>
                <span class="logo-text">kanin</span>
            </div>
            <p class="auth-tagline">Track every peso.<br/>Eat smarter every day.</p>
            <div class="auth-illustration">
                <div class="ill-ring">
                    <svg viewBox="0 0 160 160" class="ill-svg">
                        <circle cx="80" cy="80" r="65" fill="none" stroke="rgba(74,158,110,0.15)" stroke-width="14"/>
                        <circle cx="80" cy="80" r="65" fill="none" stroke="rgba(74,158,110,0.55)" stroke-width="14"
                                stroke-dasharray="408" stroke-dashoffset="120"
                                stroke-linecap="round" transform="rotate(-90 80 80)"/>
                    </svg>
                    <div class="ill-center">
                        <span class="ill-php">₱</span>
                    </div>
                </div>
                <div class="ill-pills">
                    <span class="ill-pill">☀ Breakfast</span>
                    <span class="ill-pill">◈ Lunch</span>
                    <span class="ill-pill">◐ Dinner</span>
                    <span class="ill-pill">✦ Snack</span>
                </div>
            </div>
            <p class="auth-hint">New here? <a href="signup.html" class="auth-link">Create an account →</a></p>
        </div>
    </div>

    <div class="auth-right">
        <div class="auth-form-card">

            <div class="form-head">
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-sub">Sign in to your Kanin account.</p>
            </div>

            <div class="auth-error" id="loginError"></div>

            <div class="auth-fields">
                <div class="field-group">
                    <label class="input-label" for="loginUser">Username</label>
                    <input type="text" id="loginUser" class="styled-input" placeholder="Enter your username" autocomplete="username"/>
                </div>
                <div class="field-group">
                    <label class="input-label" for="loginPass">Password</label>
                    <div class="pass-wrap">
                        <input type="password" id="loginPass" class="styled-input" placeholder="Enter your password" autocomplete="current-password"/>
                        <button class="toggle-pass" id="toggleLogin" type="button" aria-label="Show password">◎</button>
                    </div>
                </div>
            </div>

            <button class="btn-auth" id="loginBtn">Sign In</button>

            <p class="auth-switch">Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>

        </div>
    </div>

</div>

<script src="js/auth.js"></script>
</body>
</html>
